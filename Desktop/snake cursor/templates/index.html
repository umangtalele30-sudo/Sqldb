<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Snake Cursor</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>🐍 Snake Cursor</h1>

            <p>
                Smooth and slow cursor movement
            </p>

            <div class="buttons">

                <button id="startBtn">
                    ▶ Start
                </button>

                <button id="stopBtn">
                    🛑 Stop
                </button>

            </div>

            <div id="status">
                Status: Stopped
            </div>

        </div>

    </div>


    <script>

        const startBtn =
            document.getElementById("startBtn");

        const stopBtn =
            document.getElementById("stopBtn");

        const status =
            document.getElementById("status");


        startBtn.addEventListener("click", function () {

            fetch("/start")
                .then(response => response.json())
                .then(data => {

                    status.innerText =
                        "Status: Snake movement started 🐍";

                });

        });


        stopBtn.addEventListener("click", function () {

            fetch("/stop")
                .then(response => response.json())
                .then(data => {

                    status.innerText =
                        "Status: Stopped 🛑";

                });

        });

    </script>

</body>

</html>
